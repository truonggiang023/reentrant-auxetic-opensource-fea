name: Thick wall full-curve trials

on:
  push:
    branches: [feature/opencourant-erosion-calibration]
    paths:
      - .github/workflows/thick-wall-trials.yml
      - configs/wall_diagnostics/**
      - scripts/run_thick_trial.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  thick-trial:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        case: [thick_j2_full, thick_damage_full]
    env:
      OMP_NUM_THREADS: '4'
      PYTHONPATH: .:src
      MPLBACKEND: Agg
      CASE_ID: ${{ matrix.case }}
      SOURCE_COMMIT: ${{ github.sha }}
      TARGET_BRANCH: ${{ github.ref_name }}
      PUBLICATION: validation/thick_trials/${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.case }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install and qualify runtime
        run: |
          echo "OPENCOURANT_INSTALL_ROOT=$RUNNER_TEMP/opencourant" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa liblapack3 gcc
          python -m pip install -e '.[dev,post]'
          OPENCOURANT_INSTALL_ROOT="$RUNNER_TEMP/opencourant" bash scripts/setup_opencourant.sh
      - name: Run full thick-wall curve and bind evidence
        run: |
          source "$OPENCOURANT_INSTALL_ROOT/env.sh"
          mkdir -p results/thick-trial
          python scripts/run_thick_trial.py --case "$CASE_ID" \
            --config "configs/wall_diagnostics/$CASE_ID.json" \
            --prefix "results/thick-trial/$CASE_ID" \
            --publish-dir "$PUBLICATION" --source-commit "$SOURCE_COMMIT" \
            --timeout-seconds 7200 | tee results/thick-trial/controller.log
      - name: Publish verified numerical evidence
        run: |
          test -f "$PUBLICATION/summary.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$PUBLICATION"
          git commit -m "Record completed $CASE_ID diagnostic from run $GITHUB_RUN_ID"
          for attempt in 1 2 3 4 5; do
            git fetch origin "$TARGET_BRANCH"
            git rebase FETCH_HEAD
            if git push origin "HEAD:$TARGET_BRANCH"; then
              exit 0
            fi
          done
          echo '::error::Could not publish after concurrent branch updates; artifact retains all evidence.'
          exit 1
      - name: Explain scope
        if: always()
        run: |
          echo 'Thick-wall J2/damage hypothesis, target strain0.5, accelerated mean speed576mm/s. This is not physical2mm/min or completed calibration. Failed/partial runs are not published as completed evidence.' >> "$GITHUB_STEP_SUMMARY"
          if test -f "$PUBLICATION/summary.json"; then
            cat "$PUBLICATION/summary.json" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain solver evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thick-trial-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.case }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            results/thick-trial/
            ${{ env.PUBLICATION }}/
            ${{ runner.temp }}/opencourant/runtime-validation.json
